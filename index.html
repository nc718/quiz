<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7060ef">
<title>קליק — סטודיו למשחקים חיים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{--bg:#f5f6fa;--paper:#fff;--ink:#22243d;--muted:#9295aa;--line:#ececf3;--purple:#7560ed;--purple-dark:#6250d8;--lavender:#f0edff;--green:#2fba93;--lime:#d9f98b;--radius:19px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit}
button{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;transition:background .18s,transform .18s,box-shadow .18s}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b9adff;outline-offset:3px}
input,select,textarea{color:var(--ink);border:1px solid #e2e2ed;border-radius:10px;padding:11px 13px;background:#fff;min-width:0;width:100%}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--purple);flex-shrink:0}
input::placeholder,textarea::placeholder{color:#b0b0c1}
a{color:var(--purple)}
h1,h2,h3,p{margin:0}
svg{flex-shrink:0;vertical-align:middle}
[hidden]{display:none!important}
.shell{display:flex;min-height:100vh}
.sidebar{width:224px;flex-shrink:0;background:#fff;border-left:1px solid var(--line);padding:31px 18px 19px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:0 13px 35px}
.brand-mark{width:43px;height:43px;background:var(--purple);border-radius:13px;display:grid;place-items:center;box-shadow:0 6px 13px #7560ed22}
.brand-name{font-weight:900;font-size:28px;line-height:1.1;letter-spacing:-1px}
.brand-sub{font-size:8px;letter-spacing:1.55px;color:#a6a5b8;margin-top:5px;direction:ltr}
.nav-caption{font-size:10px;font-weight:600;color:#b2b1c3;padding:0 15px;margin:10px 0 9px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav-btn{justify-content:flex-start;background:transparent;color:#858599;border-radius:11px;padding:12px 13px;gap:12px;font-size:13px;text-align:right}
.nav-btn:hover{background:#f8f7fc;color:var(--purple)}
.nav-btn.active{background:var(--lavender);color:var(--purple);font-weight:700}
.nav-btn .nav-count{margin-right:auto;font-size:11px;background:#fff;border-radius:6px;min-width:22px;padding:1px 5px;text-align:center}
.nav-divider{height:1px;background:var(--line);margin:19px 13px 16px}
.sidebar-bottom{margin-top:auto;padding-top:25px}
.sidebar-help{background:#f8f7fd;border:1px solid #f0edfa;padding:16px 13px;border-radius:14px}
.sidebar-help .mini-icon{color:var(--purple);margin-bottom:10px}
.sidebar-help strong{display:block;font-size:12px;margin-bottom:5px}
.sidebar-help p{font-size:11px;color:#9b98b0;line-height:1.7}
.sidebar-help button{background:transparent;color:var(--purple);font-size:11px;padding:10px 0 0;font-weight:600}
.source-badge{margin:18px 10px 0;display:flex;align-items:center;gap:8px;font-size:10px;color:#9b98ad;cursor:pointer}
.dot{display:inline-block;width:7px;height:7px;flex-shrink:0;border-radius:50%;background:var(--green)}
.dot.amber{background:#e7ad55}
.dot.pulse{box-shadow:0 0 0 4px #2fba9312}
.main{flex:1;min-width:0}
.topbar{height:88px;background:#ffffffd9;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 33px;gap:20px}
.topbar h1{font-size:20px;font-weight:800;letter-spacing:-.5px}
.topbar p{font-size:11px;color:#aaa7b9;margin-top:4px}
.top-actions{display:flex;align-items:center;gap:12px}
.live-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid #e9e9f0;border-radius:8px;background:white;padding:8px 11px;font-size:11px;color:#8a899c;white-space:nowrap}
.btn{padding:10px 17px;border-radius:10px;background:#fff;color:#696a82;font-weight:500;font-size:12px;border:1px solid #e7e6ef;white-space:nowrap}
.btn:hover{background:#f7f6ff;border-color:#d8d1f7}
.btn.primary{background:var(--purple);border-color:var(--purple);color:white;box-shadow:0 4px 9px #7560ed17}
.btn.primary:hover{background:var(--purple-dark)}
.btn.dark{background:#292640;border-color:#292640;color:white}
.btn.lime{background:var(--lime);color:#303640;border-color:var(--lime);font-weight:700}
.btn.danger{color:#d66b76;border-color:#f1dfe3;background:#fff9fa}
.btn.ghost{background:transparent;border-color:transparent}
.btn.small{padding:7px 10px;font-size:11px;border-radius:8px;gap:5px}
.icon-btn{padding:8px;background:transparent;border-radius:8px;color:#a3a1b3;flex-shrink:0}
.icon-btn:hover{background:var(--lavender);color:var(--purple)}
.icon-btn.danger:hover{background:#fff0f2;color:#d16c80}
.content{padding:26px 33px 40px;max-width:1620px;margin:auto}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:23px}
.section-heading h2{font-weight:800;font-size:23px;letter-spacing:-.6px}
.section-heading p{font-size:12px;color:#a09daf;margin-top:5px}
.game-label{display:flex;align-items:center;gap:7px;color:#a5a0b6;font-size:11px}
.hero{min-height:214px;border-radius:21px;background:#29253f;position:relative;overflow:hidden;color:white;display:flex;justify-content:space-between;padding:26px 31px}
.hero:before{content:"";position:absolute;width:530px;height:530px;left:-70px;top:-190px;background:radial-gradient(ellipse,#6b4cc557,transparent 65%);pointer-events:none}
.hero:after{content:"";position:absolute;width:340px;height:340px;left:74px;top:-68px;border:1px solid #ffffff08;border-radius:50%;box-shadow:0 0 0 42px #ffffff03,0 0 0 84px #ffffff02;pointer-events:none}
.hero-copy{position:relative;z-index:1;max-width:65%}
.hero-eyebrow{display:flex;align-items:center;gap:8px;color:#c3bddd;font-size:10px;margin-bottom:11px}
.hero-eyebrow .dot{width:6px;height:6px;background:var(--lime)}
.hero h2{font-size:31px;line-height:1.35;font-weight:800;letter-spacing:-.8px}
.hero h2 em{font-style:normal;color:var(--lime)}
.hero p{font-size:11px;color:#b2abc8;margin-top:8px}
.hero-actions{display:flex;gap:11px;margin-top:22px;flex-wrap:wrap}
.hero-actions .btn{padding:10px 17px}
.hero-actions .subtle{background:#ffffff08;border-color:#ffffff1c;color:#e8e2f7}
.hero-orbit{width:235px;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:21px}
.orbit-circle{width:144px;height:144px;border:1px solid #b6a4ee29;border-radius:50%;background:radial-gradient(ellipse,#8e71d322,#ffffff02);display:flex;align-items:center;justify-content:center;flex-direction:column}
.orbit-circle strong{font-size:56px;line-height:1.05;font-weight:800;letter-spacing:-3px}
.orbit-circle span{font-size:10px;color:#bcb2d4;margin-top:8px}
.orbit-avatar{position:absolute;width:37px;height:37px;border-radius:12px;border:4px solid #302943;display:grid;place-items:center;font-size:12px;font-weight:700;box-shadow:0 6px 15px #17101b33}
.orbit-avatar.one{top:5px;right:35px;transform:rotate(10deg);background:#f5c4a9;color:#8d564e}
.orbit-avatar.two{bottom:3px;left:34px;transform:rotate(-12deg);background:#becdf8;color:#4e5c8e}
.orbit-avatar.three{top:27px;left:7px;transform:rotate(-8deg);background:#d2edb0;color:#5b7b40}
.orbit-star{position:absolute;color:#beacfc;right:11px;bottom:28px;font-size:20px}
.orbit-dot{width:7px;height:7px;background:var(--lime);position:absolute;left:24px;bottom:56px;border-radius:2px;transform:rotate(25deg)}
.stats-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:19px 0 25px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:13px;padding:17px 18px}
.stat-icon{width:41px;height:41px;border-radius:12px;display:grid;place-items:center;background:#f0edff;color:#8571e7;flex-shrink:0}
.stat-icon.teal{background:#eaf8f4;color:#56b9a0}
.stat-icon.orange{background:#fff3e8;color:#e6a466}
.stat-icon.blue{background:#edf2ff;color:#7996e0}
.stat-label{font-size:10px;color:#aaa6b9}
.stat-value{font-size:23px;font-weight:800;line-height:1.25;letter-spacing:-.5px}
.stat-value small{font-size:10px;font-weight:500;color:#a19caf;letter-spacing:0;margin-right:4px}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(260px,1fr);gap:22px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 3px 5px #25243a01}
.card-header{padding:20px 22px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-title{display:flex;align-items:center;gap:8px}
.card-title h3{font-size:14px;font-weight:700}
.count-pill{font-size:10px;padding:2px 7px;background:#f5f4fa;border-radius:6px;color:#a39db9}
.card-header p{font-size:10px;color:#aaa5bc;margin-top:5px}
.card-actions{display:flex;align-items:center;gap:7px}
.question-tabs{display:flex;align-items:center;gap:20px;padding:0 22px;border-bottom:1px solid #f2f1f7;height:40px}
.question-tabs button{background:transparent;font-size:10px;padding:10px 0;color:#aaa5b9;height:100%;border-bottom:2px solid transparent}
.question-tabs button.active{color:var(--purple);border-bottom-color:var(--purple);font-weight:700}
.question-tabs .drag-note{margin-right:auto;color:#bbb6c9;font-size:9px;display:flex;align-items:center;gap:4px}
.question-row{display:flex;align-items:center;gap:10px;padding:14px 19px;border-bottom:1px solid #f3f2f8;transition:background .15s;min-height:77px}
.question-row:last-child{border-bottom:0}
.question-row:hover{background:#fcfbff}
.question-row.dragging{opacity:.35;background:var(--lavender)}
.question-row.drag-over{box-shadow:inset 0 2px 0 var(--purple)}
.drag-handle{color:#ccc8d9;cursor:grab;display:flex}
.question-index{width:31px;height:33px;border-radius:9px;background:#f7f6fc;color:#aaa3c4;display:grid;place-items:center;font-size:11px;font-weight:600;flex-shrink:0}
.question-detail{flex:1;min-width:0}
.question-text{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.question-meta{display:flex;align-items:center;gap:9px;font-size:9px;color:#aaa5bb;margin-top:6px}
.question-meta .tag{font-size:8px;background:#f3f0ff;color:#9b8acc;border-radius:4px;padding:1px 5px}
.question-meta .tag.survey{color:#c2a16d;background:#fff7e9}
.row-actions{display:flex;align-items:center;gap:0}
.row-actions .icon-btn{padding:5px}
.reorder-pair{display:flex;flex-direction:column;gap:0}
.reorder-pair button{padding:0 3px;height:16px}
.card-footer{padding:12px 20px;border-top:1px solid #f3f1f8;display:flex;align-items:center;justify-content:center}
.card-footer button{color:#9a8fc0;font-size:10px;background:transparent}
.participants-summary{display:flex;align-items:center;justify-content:space-between;padding:0 22px 16px}
.participants-summary strong{font-size:30px;letter-spacing:-1px;line-height:1.3}
.participants-summary small{display:block;color:#aaa5b9;font-size:10px;font-weight:400}
.avatar-stack{display:flex;direction:ltr;padding-left:3px}
.avatar-stack .avatar{margin-left:-9px;border:3px solid white;width:35px;height:35px;font-size:10px}
.avatar{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:11px;font-weight:600;color:#7d6ca8;background:#eee7fb;flex-shrink:0}
.participant-row{display:flex;align-items:center;gap:10px;padding:10px 22px}
.participant-row .person{flex:1;min-width:0}
.participant-row .person strong{font-size:11px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.participant-row .person small{font-size:9px;color:#b2acbf}
.participant-row .dot{width:5px;height:5px}
.live-tag{display:flex;align-items:center;gap:5px;color:#52b49a;font-size:9px;letter-spacing:.6px}
.participants-note{margin:14px 20px 18px;padding:10px 11px;border-radius:9px;background:#f8faf9;display:flex;align-items:center;gap:7px;font-size:9px;color:#94aba1}
.page-toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.toolbar-spacer{margin-right:auto}
.info-strip{padding:14px 17px;background:#f0edff;color:#8b7bb0;border:1px solid #e8e3fa;display:flex;align-items:flex-start;gap:10px;font-size:11px;border-radius:12px;line-height:1.9;margin-bottom:20px}
.info-strip.green{background:#eff9f5;border-color:#e1f1ea;color:#72a593}
.info-strip.amber{background:#fff8ed;border-color:#f6e9d6;color:#b69b70}
.empty{text-align:center;padding:45px 20px;color:#a49fb6}
.empty svg{margin-bottom:12px;color:#c5bbdf}
.empty h3{font-size:15px;margin-bottom:7px;color:#7f7597}
.empty p{font-size:11px;line-height:1.9}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:right;white-space:nowrap}
th{background:#faf9fd;font-size:10px;font-weight:500;color:#aaa5bb;padding:15px 20px;border-bottom:1px solid var(--line)}
td{font-size:11px;padding:15px 20px;border-bottom:1px solid #f2f1f7}
tr:last-child td{border-bottom:0}
.table-person{display:flex;align-items:center;gap:10px}
.table-person strong{font-weight:500}
.status{font-size:9px;display:inline-flex;align-items:center;gap:6px;padding:4px 8px;background:#f0f9f5;color:#73af98;border-radius:5px}
.status.offline{background:#f7f6fa;color:#b5aec3}
.status.offline .dot{background:#ccc7d4}
.searchbox{position:relative;max-width:300px;flex:1;min-width:160px}
.searchbox svg{position:absolute;top:12px;right:12px;color:#b0a9c2}
.searchbox input{padding-right:39px;font-size:11px;background:#fff}
.rank{width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:#f5f3fa;color:#a29ab7;font-size:11px}
.rank.first{background:#fff5d9;color:#cfaa4f}
.rank.second{background:#f1f3f9;color:#98a2b9}
.rank.third{background:#fff0e5;color:#c89e7e}
.score-number{font-weight:700;color:var(--purple);font-size:14px}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.settings-card{padding:24px}
.settings-card h3{font-size:14px;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.settings-card>p{font-size:10px;color:#a29ab3;line-height:1.8;margin-bottom:22px}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.field label{font-size:11px;color:#817890;font-weight:500}
.field small{font-size:9px;color:#aaa0b9;line-height:1.7}
.fields-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:13px 0;border-bottom:1px solid #f2f0f7}
.toggle-row:last-child{border:0}
.toggle-row strong{display:block;font-size:11px;font-weight:500}
.toggle-row small{display:block;font-size:9px;color:#aaa1b9;margin-top:4px}
.toggle{appearance:none!important;width:34px!important;height:19px!important;border:0!important;border-radius:20px!important;background:#ded9ea;position:relative;cursor:pointer;padding:0!important}
.toggle:after{content:"";position:absolute;background:white;border-radius:50%;width:13px;height:13px;top:3px;right:3px;transition:transform .2s}
.toggle:checked{background:var(--purple)}
.toggle:checked:after{transform:translateX(-15px)}
.form-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.history-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.history-card{padding:23px}
.history-card .date{color:#b5aac6;font-size:10px;margin-bottom:13px}
.history-card h3{font-size:16px}
.history-card .history-meta{display:flex;gap:18px;color:#a99eb8;font-size:10px;margin:14px 0}
.history-winner{background:#f8f6fd;border-radius:11px;padding:12px;display:flex;gap:9px;align-items:center;color:#9e8cbe;font-size:11px;margin-bottom:17px}
.history-winner span{display:block;color:#bab0c9;font-size:9px;margin-top:2px}
.history-actions{display:flex;gap:5px;align-items:center}
.history-actions .danger{margin-right:auto}
.api-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:22px}
.api-card{padding:25px}
.api-card h3{font-size:15px;margin-bottom:9px}
.api-card p{font-size:11px;color:#a69ab4;line-height:1.9;margin-bottom:17px}
.codebox{background:#27233a;color:#c6bce5;font-family:ui-monospace,Consolas,monospace;font-size:11px;padding:17px;border-radius:11px;direction:ltr;text-align:left;word-break:break-all;line-height:2;position:relative}
.codebox .code-accent{color:var(--lime)}
.api-table td,.api-table th{padding:12px;font-size:10px}
.api-table td:first-child{font-family:monospace;direction:ltr;text-align:left;color:var(--purple)}
.step-item{display:flex;gap:11px;margin:17px 0}
.step-item .step-num{width:25px;height:25px;border-radius:8px;background:#f0ecfc;color:var(--purple);display:grid;place-items:center;flex-shrink:0;font-size:11px}
.step-item strong{font-size:11px;display:block;margin-bottom:4px}
.step-item p{font-size:10px;margin:0;line-height:1.8}
.modal-backdrop{position:fixed;inset:0;background:#21193370;backdrop-filter:blur(5px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:white;width:560px;max-width:100%;max-height:90dvh;border-radius:20px;box-shadow:0 30px 100px #190d3c40;display:flex;flex-direction:column;animation:modalIn .18s ease-out}
.modal.wide{width:790px}
@keyframes modalIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:22px 25px 17px;border-bottom:1px solid #f0edf7}
.modal-head h2{font-size:18px;font-weight:700}
.modal-body{overflow-y:auto;padding:23px 25px}
.modal-sub{color:#a69cb5;font-size:11px;line-height:1.9;margin-bottom:20px}
.modal-actions{display:flex;align-items:center;justify-content:flex-end;gap:9px;margin-top:23px}
.option-edit{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.option-edit .option-num{font-size:11px;color:#afa3c5;width:17px;text-align:center;flex-shrink:0}
.option-edit input[type=text]{font-size:12px}
.option-edit input[type=radio]{margin:0 3px}
.choice-note{display:flex;align-items:center;gap:6px;color:#a99cbd;font-size:9px;margin-bottom:12px}
.confirm-illustration{width:53px;height:53px;border-radius:15px;background:#f2edff;color:var(--purple);display:grid;place-items:center;margin-bottom:17px}
.import-preview{background:#faf8ff;border:1px solid #ede6fa;padding:13px;border-radius:10px;font-size:11px;color:#9d8caf;line-height:2.2;margin:12px 0}
.test-result{min-height:41px;border-radius:9px;background:#f7f5fc;padding:12px;margin-top:14px;color:#a69bb9;font-size:11px}
.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);background:#2e2942;color:#f0ecff;z-index:200;padding:13px 21px;border-radius:12px;font-size:12px;box-shadow:0 10px 30px #2820342b;opacity:0;pointer-events:none;transition:.2s;display:flex;gap:10px;align-items:center;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* The audience and game always fit the screen. */
body.stage-open{overflow:hidden}
.stage{position:fixed;inset:0;z-index:50;height:100dvh;overflow:hidden;background:#161429;color:#fff;display:flex;flex-direction:column;isolation:isolate}
.stage:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 15% 15%,#5a3db848,transparent 45%),radial-gradient(ellipse at 85% 95%,#344b8e30,transparent 50%),radial-gradient(circle at 50% 45%,#ffffff03 1px,transparent 1px);background-size:auto,auto,23px 23px;pointer-events:none}

DATA.mkdir(exist_ok=True)

def ranking(s):
    return sorted(s["players"], key=lambda p: (
      -s["scores"].get(p["id"],{}).get("points",0),
       s["scores"].get(p["id"],{}).get("timeMs",0),p.get("name") or p["id"]))

def summary(s):
    ranked=ranking(s)
    top=ranked[0] if ranked else None
    winner=(top.get("name") or top["id"]) if top and s["scores"].get(top["id"],{}).get("points",0)>0 else "ללא ניקוד"
    return dict(id=s["game"]["id"],title=s["settings"]["title"],
        createdAt=s["game"]["createdAt"],endedAt=now(),
        totalPlayers=len(s["players"]),totalQuestions=len(s["questions"]),winner=winner)

def safe_csv(v):
    if isinstance(v,str) and v.startswith(("=","+","-","@","\t","\r")): return "'"+v
    return v

def atomic_text(path,text):
    tmp=path.with_suffix(path.suffix+".tmp")
    tmp.write_text(text,encoding="utf-8")
    tmp.replace(path)

def csv_write(path,rows):
    tmp=path.with_suffix(".tmp")
    with tmp.open("w",encoding="utf-8-sig",newline="") as f:
        w=csv.writer(f)
        for row in rows: w.writerow([safe_csv(v) for v in row])
    tmp.replace(path)

def exports(s):
    directory=DATA/"games"/s["game"]["id"]
    directory.mkdir(exist_ok=True)
    rows=[["rank","ApiPhone","name","points","correct_time_ms","correct_count"]]
    for index,p in enumerate(ranking(s),1):
        score=s["scores"].get(p["id"],{})
        rows.append([index,p["id"],p.get("name",""),score.get("points",0),
                     score.get("timeMs",0),score.get("correct",0)])
    csv_write(directory/"scores.csv",rows)
    rows=[["question_id","ApiPhone","answer","correct","elapsed_ms","points","received_at_ms"]]
    for qid,answers in s["answers"].items():
        for pid,a in answers.items():
            rows.append([qid,pid,a["choice"],int(a["correct"]),a["elapsed"],
                         a["points"],a["at"]])
    csv_write(directory/"answers.csv",rows)
    snap={k:v for k,v in s.items() if k!="history"}
    atomic_text(directory/"game.json",json.dumps(snap,ensure_ascii=False,indent=2))
    return directory

def persist():
    # All callers hold LOCK: validation, duplicate prevention and score changes
    # are serialized. SQLite commits the entire live state atomically.
    S["revision"]+=1
    db.execute("INSERT OR REPLACE INTO live VALUES (1,?)",
               (json.dumps(S,ensure_ascii=False),))
    db.commit()
    exports(S)
    csv_write(DATA/"players.csv",[["ApiPhone","name"]]+[
        [p["id"],p.get("name","")] for p in S["players"]])
    atomic_text(DATA/"questions.json",json.dumps(S["questions"],ensure_ascii=False,indent=2))
    CV.notify_all()

def view(private=False):
    s=copy.deepcopy(S)
    s["serverNow"]=now()
    if not private:
        mapping={p["id"]:"p_"+hashlib.sha256(
            (str(app.secret_key)+p["id"]).encode()).hexdigest()[:16] for p in s["players"]}
        for p in s["players"]:
            original=p["id"]
            shown=original
            if s["settings"].get("maskPhones") and len(original)>5:
                shown=original[:3]+"••••"+original[-3:]
            p["name"]=p.get("name") or shown
            p["id"]=mapping[original]
        s["scores"]={mapping[k]:v for k,v in s["scores"].items() if k in mapping}
        s["answers"]={qid:{mapping[k]:v for k,v in answers.items() if k in mapping}
                      for qid,answers in s["answers"].items()}
        s["settings"].pop("phoneKey",None)
        s["history"]=[]
        # Correct answers are not sent to the audience before results.
        for i,q in enumerate(s["questions"]):
            if i>s["game"]["qIndex"] or (i==s["game"]["qIndex"] and
                    s["game"]["phase"] not in ("results","finished")):
                q["correct"]=None
    return s

def integer(value,low,high,label):
    try:
        number=float(value)
        if not number.is_integer() or not low<=number<=high: raise ValueError()
        return int(number)
    except (TypeError,ValueError,OverflowError):
        raise ValueError(label+" אינו תקין")

def normalize_id(value):
    value=str(value or "").strip()
    if not value or len(value)>64: raise ValueError("נדרש מזהה תקין, עד 64 תווים")
    return value

def validate_question(raw):
    text=str(raw.get("text","")).strip()
    options=[str(x).strip() for x in raw.get("options",[])]
    if not text or len(text)>300: raise ValueError("נדרש נוסח שאלה, עד 300 תווים")
    if len(options) not in (3,4) or any(not x or len(x)>120 for x in options):
        raise ValueError("נדרשות 3 או 4 תשובות, עד 120 תווים לכל תשובה")
    kind="survey" if raw.get("type")=="survey" else "quiz"
    correct=None if kind=="survey" else integer(raw.get("correct"),1,len(options),"מספר תשובה")
    limit=None if raw.get("time") in (None,"") else integer(raw["time"],1,600,"זמן")
    points=0 if kind=="survey" else (None if raw.get("points") in (None,"")
                                  else integer(raw["points"],0,10000,"ניקוד"))
    return dict(id=str(raw.get("id") or "q_"+secrets.token_hex(6)),text=text,
                options=options,type=kind,correct=correct,time=limit,points=points)

def lobby_only():
    if S["game"]["phase"]!="lobby":
        raise ValueError("עריכת שאלות זמינה בלובי. פתחו משחק חדש כדי לשנות את המשחק.")

def question():
    return S["questions"][S["game"]["qIndex"]]

def reveal_question(t):
    g=S["game"]
    g.update(phase="reveal",revealed=0,openedAt=None,closedAt=None,
             pausedAt=None,pauseTotal=0,nextAt=None)
    g["revealAt"]=t+round(S["settings"]["revealDelay"]*1000) if S["settings"]["autoReveal"] else None

def open_question(t):
    q=question();g=S["game"]
    g.update(phase="answering",revealed=len(q["options"]),openedAt=t,
             pausedAt=None,pauseTotal=0,revealAt=None,nextAt=None,
             duration=q["time"] if q.get("time") is not None else S["settings"]["defaultTime"],
             points=(q["points"] if q.get("points") is not None else S["settings"]["defaultPoints"])
             if q["type"]=="quiz" else 0)

def close_question(t):
    g=S["game"]
    g.update(phase="results",closedAt=t,pausedAt=None,revealAt=None)
    g["nextAt"]=t+S["settings"]["transitionDelay"]*1000 if S["settings"]["transition"]=="auto" else None

def step(t):
    g=S["game"]
    if g["phase"]=="lobby":
        if not S["questions"]: raise ValueError("הוסיפו שאלה לפני תחילת המשחק")
        if S["settings"]["shuffle"]:
            import random
            random.shuffle(S["questions"])
        g["qIndex"]=0
        reveal_question(t)
    elif g["phase"]=="reveal":
        if g["revealed"]<len(question()["options"]):
            g["revealed"]+=1
            g["revealAt"]=t+round(S["settings"]["revealDelay"]*1000) if S["settings"]["autoReveal"] else None
        else: open_question(t)
    elif g["phase"]=="answering": close_question(t)
    elif g["phase"]=="results":
        if g["qIndex"]+1>=len(S["questions"]):
            g.update(phase="finished",nextAt=None)
        else:
            g["qIndex"]+=1
            reveal_question(t)

def tick(t):
    g=S["game"]
    if g["phase"]=="answering" and g["pausedAt"] is None:
        if t-g["openedAt"]-g["pauseTotal"]>=g["duration"]*1000:
            close_question(t);return True
    if g["phase"]=="reveal" and g.get("revealAt") is not None and t>=g["revealAt"]:
        step(t);return True
    if g["phase"]=="results" and g.get("nextAt") is not None and t>=g["nextAt"]:
        step(t);return True
    return False

def action(kind,p):
    t=now();g=S["game"]
    if kind in ("start","step"):
        if kind=="start" and g["phase"]!="lobby": raise ValueError("המשחק כבר התחיל")
        step(t)
    elif kind=="open":
        if g["phase"]!="reveal": raise ValueError("המענה אינו ניתן לפתיחה כעת")
        open_question(t)
    elif kind=="back":
        if g["phase"]=="reveal":
            g["revealed"]=max(0,g["revealed"]-1)
            g["revealAt"]=t+round(S["settings"]["revealDelay"]*1000) if S["settings"]["autoReveal"] else None
    elif kind=="pause":
        if g["phase"]!="answering": raise ValueError("אפשר להשהות רק בזמן מענה")
        if g["pausedAt"] is None: g["pausedAt"]=t
        else:
            g["pauseTotal"]+=t-g["pausedAt"]
            g["pausedAt"]=None
    elif kind=="finish":
        g.update(phase="finished",nextAt=None,revealAt=None,pausedAt=None)
    elif kind=="reset":
        snap=copy.deepcopy(S);snap.pop("history",None)
        entry=summary(snap);entry["snapshot"]=snap
        exports(snap)
        db.execute("INSERT OR REPLACE INTO history VALUES (?,?)",
                   (entry["id"],json.dumps(entry,ensure_ascii=False)))
        S.update(game=new_game(),scores={},answers={})
        S["history"]=history_summaries()
    elif kind=="save_question":
        lobby_only();q=validate_question(p["question"])
        index=next((i for i,x in enumerate(S["questions"]) if x["id"]==q["id"]),None)
        if index is None: S["questions"].append(q)
        else: S["questions"][index]=q
    elif kind=="delete_question":
        lobby_only();S["questions"]=[q for q in S["questions"] if q["id"]!=p["id"]]
    elif kind=="reorder":
        lobby_only();ids=p["ids"];existing={q["id"]:q for q in S["questions"]}
        if len(ids)!=len(existing) or set(ids)!=set(existing): raise ValueError("סדר שאלות אינו תקין")
        S["questions"]=[existing[x] for x in ids]
    elif kind=="import_questions":
        lobby_only()
        if not isinstance(p.get("questions"),list) or len(p["questions"])>1000:
            raise ValueError("ניתן לייבא עד 1,000 שאלות")
        questions=[validate_question({**x,"id":"q_"+secrets.token_hex(6)}) for x in p["questions"]]
        S["questions"]=questions if p.get("replace") else S["questions"]+questions
    elif kind in ("save_player","import_players"):
        rows=p["players"] if kind=="import_players" else [p["player"]]
        if len(rows)>20000: raise ValueError("יותר מדי משתתפים")
        rows=[dict(id=normalize_id(x.get("id")),name=str(x.get("name","")).strip()[:80]) for x in rows]
        existing={x["id"]:x for x in S["players"]}
        for row in rows:
            if row["id"] in existing: existing[row["id"]]["name"]=row["name"]
            else:
                player={**row,"connected":False,"joinedAt":None,"lastSeen":None}
                S["players"].append(player);existing[row["id"]]=player
    elif kind=="disconnect":
        for player in S["players"]:
            if player["id"]==p["id"]: player["connected"]=False
    elif kind=="save_settings":
        raw=p["settings"];settings=copy.deepcopy(S["settings"])
        title=str(raw.get("title","")).strip()
        if not title or len(title)>80: raise ValueError("נדרש שם משחק, עד 80 תווים")
        key=str(raw.get("phoneKey","")).strip()
        if len(key)<8 or len(key)>128: raise ValueError("מפתח API חייב להכיל 8–128 תווים")
        settings.update(title=title,phoneKey=key,
            phoneNumber=str(raw.get("phoneNumber",""))[:40],
            defaultTime=integer(raw.get("defaultTime"),1,600,"זמן ברירת מחדל"),
            defaultPoints=integer(raw.get("defaultPoints"),0,10000,"ניקוד ברירת מחדל"),
            transition="auto" if raw.get("transition")=="auto" else "manual",
            transitionDelay=integer(raw.get("transitionDelay"),1,60,"זמן מעבר"))
        try: delay=float(raw.get("revealDelay",1.2))
        except (ValueError,TypeError): raise ValueError("זמן חשיפה אינו תקין")
        if not .4<=delay<=10: raise ValueError("זמן החשיפה הוא 0.4–10 שניות")
        settings["revealDelay"]=delay
        for flag in ("autoReveal","shuffle","maskPhones"): settings[flag]=bool(raw.get(flag))
        S["settings"]=settings
    elif kind in ("delete_history","clear_history"):
        ids=[p["id"]] if kind=="delete_history" else [h["id"] for h in S["history"]]
        allowed={h["id"] for h in S["history"]}
        for game_id in ids:
            if game_id not in allowed: continue
            db.execute("DELETE FROM history WHERE id=?",(game_id,))
            shutil.rmtree(DATA/"games"/game_id,ignore_errors=True)
        S["history"]=history_summaries()
    else: raise ValueError("פעולה לא מוכרת")

@app.get("/api/events")

    private=private_view()
    @stream_with_context
    def generate():
        revision=-1
        while True:
            with CV:
                if revision==S["revision"]: CV.wait(timeout=12)
                changed=revision!=S["revision"]
                if changed:
                    body=json.dumps(view(private),ensure_ascii=False)
                    revision=S["revision"]
            if changed: yield "data: "+body+"\n\n"
            else: yield ": heartbeat\n\n"
    return Response(generate(),mimetype="text/event-stream",
        headers={"Cache-Control":"no-cache","X-Accel-Buffering":"no"})

@app.route("/api/phone",methods=["GET","POST"])
def phone():
    params=request.args.to_dict()
    params.update(request.form.to_dict())
    body=request.get_json(silent=True)
    if isinstance(body,dict): params.update(body)
    def reply(text,status=200):
        return Response(text,status=status,content_type="text/plain; charset=utf-8",
                        headers={"Cache-Control":"no-store"})
    with LOCK:
        if not secrets.compare_digest(str(params.get("key","")),S["settings"]["phoneKey"]):
            return reply("ERROR",403)
        try: pid=normalize_id(params.get("ApiPhone"))
        except ValueError: return reply("ERROR")
        t=now();tick(t)
        player=next((x for x in S["players"] if x["id"]==pid),None)
        if str(params.get("hangup","")).lower()=="yes":
            if player: player["connected"]=False;player["lastSeen"]=t
            persist();return reply("בסדר")
        if not player:
            player=dict(id=pid,name="",connected=True,joinedAt=t,lastSeen=t)
            S["players"].append(player)
        else:
            if not player["connected"]: player["joinedAt"]=t
            player["connected"]=True;player["lastSeen"]=t
        if params.get("תשובה") in (None,""):
            persist();return reply("בסדר")
        g=S["game"]
        if g["phase"]!="answering" or g["pausedAt"] is not None:
            persist();return reply("ERROR")
        q=question()
        try: choice=integer(params["תשובה"],1,len(q["options"]),"תשובה")
        except ValueError:
            persist();return reply("ERROR")
        answers=S["answers"].setdefault(q["id"],{})
        if pid in answers:
            persist();return reply("ERROR")
        elapsed=max(0,t-g["openedAt"]-g["pauseTotal"])
        if elapsed>=g["duration"]*1000:
            close_question(t);persist();return reply("ERROR")
        correct=q["type"]=="quiz" and choice==q["correct"]
        earned=g["points"] if correct else 0
        answers[pid]=dict(choice=choice,correct=correct,elapsed=elapsed,points=earned,at=t)
        if correct:
            score=S["scores"].setdefault(pid,dict(points=0,timeMs=0,correct=0))
            score["points"]+=earned;score["timeMs"]+=elapsed;score["correct"]+=1
        persist()
        return reply("בסדר" if correct or q["type"]=="survey" else "ERROR")

let state=load(),source="local",authenticated=true,serverOnline=false,eventStream=null,clockOffset=0,view="home",qFilter="all",playerQuery="",isStage=false,stagePage=0,audioOn=false,audioContext=null,lastBeep="",importKind="questions",activeHistory=null,modalReturnFocus=null;

function refreshFromStorage(){try{const s=JSON.parse(localStorage.getItem(STORE));if(s?.revision>state.revision)state=s}catch(e){}}

}

function checkInt(v,min,max,label){const n=Number(v);if(!Number.isInteger(n)||n<min||n>max)throw Error(label+" אינו תקין");return n}
function normalizeID(v){const s=String(v??"").trim();if(!s||s.length>64)throw Error("יש להזין מזהה תקין, עד 64 תווים");return s}
function validateQuestion(raw){
const text=String(raw.text||"").trim(),options=(raw.options||[]).map(x=>String(x).trim());
if(!text||text.length>300)throw Error("נדרש נוסח שאלה, עד 300 תווים");
if(![3,4].includes(options.length)||options.some(x=>!x||x.length>120))throw Error("נדרשות 3 או 4 תשובות, עד 120 תווים לתשובה");
const type=raw.type==="survey"?"survey":"quiz";
return {id:raw.id||uid("q"),text,options,type,correct:type==="survey"?null:checkInt(raw.correct,1,options.length,"מספר תשובה נכונה"),time:raw.time==null||raw.time===""?null:checkInt(raw.time,1,600,"זמן"),points:type==="survey"?0:(raw.points==null||raw.points===""?null:checkInt(raw.points,0,10000,"ניקוד"))}
}
function lobbyOnly(){if(state.game.phase!=="lobby")throw Error("עריכת שאלות זמינה בלובי. פתחו משחק חדש כדי לערוך.")}
function revealQuestion(t){Object.assign(state.game,{phase:"reveal",revealed:0,openedAt:null,closedAt:null,pausedAt:null,pauseTotal:0,nextAt:null,revealAt:state.settings.autoReveal?t+state.settings.revealDelay*1000:null})}
function openQuestion(t){const q=currentQ();Object.assign(state.game,{phase:"answering",revealed:q.options.length,openedAt:t,pausedAt:null,pauseTotal:0,revealAt:null,nextAt:null,duration:timeLimit(q),points:questionPoints(q)})}
function closeQuestion(t){Object.assign(state.game,{phase:"results",closedAt:t,pausedAt:null,revealAt:null,nextAt:state.settings.transition==="auto"?t+state.settings.transitionDelay*1000:null})}
function stepGame(t){
const g=state.game;
if(g.phase==="lobby"){
if(!state.questions.length)throw Error("הוסיפו שאלה לפני תחילת המשחק");
if(state.settings.shuffle)for(let i=state.questions.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[state.questions[i],state.questions[j]]=[state.questions[j],state.questions[i]]}
g.qIndex=0;revealQuestion(t);
}else if(g.phase==="reveal"){
if(g.revealed<currentQ().options.length){g.revealed++;g.revealAt=state.settings.autoReveal?t+state.settings.revealDelay*1000:null}else openQuestion(t);
}else if(g.phase==="answering")closeQuestion(t);
else if(g.phase==="results"){if(g.qIndex+1>=state.questions.length){g.phase="finished";g.nextAt=null}else{g.qIndex++;revealQuestion(t)}}
}
function engineTick(t){
const g=state.game;
if(g.phase==="answering"&&g.pausedAt===null&&t-g.openedAt-g.pauseTotal>=g.duration*1000){closeQuestion(t);return true}
if(g.phase==="reveal"&&g.revealAt!=null&&t>=g.revealAt){stepGame(t);return true}
if(g.phase==="results"&&g.nextAt!=null&&t>=g.nextAt){stepGame(t);return true}
return false;
}
function localAction(type,p={}){
refreshFromStorage();const t=Date.now(),g=state.game;engineTick(t);
switch(type){
case "start":if(g.phase!=="lobby")throw Error("המשחק כבר התחיל");stepGame(t);break;
case "step":stepGame(t);break;
case "open":if(g.phase!=="reveal")throw Error("המענה אינו ניתן לפתיחה כעת");openQuestion(t);break;
case "back":if(g.phase==="reveal"){g.revealed=Math.max(0,g.revealed-1);g.revealAt=state.settings.autoReveal?t+state.settings.revealDelay*1000:null}break;
case "pause":if(g.phase!=="answering")throw Error("אפשר להשהות רק בזמן מענה");if(g.pausedAt==null)g.pausedAt=t;else{g.pauseTotal+=t-g.pausedAt;g.pausedAt=null}break;
case "finish":Object.assign(g,{phase:"finished",nextAt:null,revealAt:null,pausedAt:null});break;
case "reset":{
const snapshot=clone(state);delete snapshot.history;delete snapshot.serverNow;
const top=ranking(snapshot)[0];
state.history.unshift({id:g.id,title:state.settings.title,createdAt:g.createdAt,endedAt:t,totalPlayers:state.players.length,totalQuestions:state.questions.length,winner:top&&score(top,snapshot).points>0?(top.name||top.id):"ללא ניקוד",snapshot});
state.game=gameFresh();state.answers={};state.scores={};stagePage=0;break}
case "save_question":{
lobbyOnly();const q=validateQuestion(p.question),i=state.questions.findIndex(x=>x.id===q.id);if(i<0)state.questions.push(q);else state.questions[i]=q;break}
case "delete_question":lobbyOnly();state.questions=state.questions.filter(x=>x.id!==p.id);break;
case "reorder":lobbyOnly();if(p.ids.length!==state.questions.length||new Set(p.ids).size!==state.questions.length)throw Error("סדר לא תקין");state.questions=p.ids.map(id=>state.questions.find(q=>q.id===id));if(state.questions.some(x=>!x))throw Error("סדר לא תקין");break;
case "import_questions":{lobbyOnly();const qs=p.questions.map(q=>validateQuestion({...q,id:uid("q")}));state.questions=p.replace?qs:[...state.questions,...qs];break}
case "save_player":case "import_players":{
const rows=(type==="save_player"?[p.player]:p.players).map(x=>({id:normalizeID(x.id),name:String(x.name||"").trim().slice(0,80)}));
for(const row of rows){const existing=state.players.find(x=>x.id===row.id);if(existing)existing.name=row.name;else state.players.push({...row,connected:false,joinedAt:null,lastSeen:null})}break}
case "disconnect":{const player=state.players.find(x=>x.id===p.id);if(player)player.connected=false;break}
case "save_settings":{
const raw=p.settings,s={...state.settings,...raw};
if(!s.title.trim()||s.title.length>80)throw Error("נדרש שם משחק, עד 80 תווים");
if(s.phoneKey.length<8||s.phoneKey.length>128)throw Error("מפתח API חייב להכיל 8–128 תווים");
checkInt(s.defaultTime,1,600,"זמן");checkInt(s.defaultPoints,0,10000,"ניקוד");checkInt(s.transitionDelay,1,60,"זמן מעבר");
if(!Number.isFinite(s.revealDelay)||s.revealDelay<.4||s.revealDelay>10)throw Error("זמן החשיפה הוא 0.4–10 שניות");
state.settings=s;break}
case "delete_history":state.history=state.history.filter(h=>h.id!==p.id);break;
case "clear_history":state.history=[];break;
default:throw Error("פעולה לא מוכרת");
}
saveLocal();return state;
}
async function act(type,payload={}){
if(!canControl()){loginModal();throw Error("נדרשת התחברות מנהל")}
if(source==="local")return localAction(type,payload);
const r=await fetch("/api/action",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type,payload})});
const data=await r.json();if(!r.ok)throw Error(data.error||"הפעולה לא הושלמה");accept(data.state,true);return state;
}
function localPhone(params){
refreshFromStorage();const t=Date.now();engineTick(t);
if(params.key!==state.settings.phoneKey)throw Error("מפתח API אינו נכון");
const id=normalizeID(params.ApiPhone);let p=state.players.find(x=>x.id===id),result="בסדר";
if(params.hangup==="yes"){if(p){p.connected=false;p.lastSeen=t}saveLocal();return result}
if(!p){p={id,name:"",connected:true,joinedAt:t,lastSeen:t};state.players.push(p)}else{if(!p.connected)p.joinedAt=t;p.connected=true;p.lastSeen=t}
if(params["תשובה"]!=null&&params["תשובה"]!==""){
const g=state.game,q=currentQ(),choice=Number(params["תשובה"]);
if(g.phase!=="answering"||g.pausedAt!=null||!Number.isInteger(choice)||choice<1||choice>q.options.length)result="ERROR";
else{
const a=state.answers[q.id]||(state.answers[q.id]={}),elapsed=Math.max(0,t-g.openedAt-g.pauseTotal);
if(a[id]||elapsed>=g.duration*1000)result="ERROR";
else{
const correct=q.type==="quiz"&&q.correct===choice,earned=correct?g.points:0;
a[id]={choice,correct,elapsed,points:earned,at:t};
if(correct){const sc=state.scores[id]||(state.scores[id]={points:0,timeMs:0,correct:0});sc.points+=earned;sc.timeMs+=elapsed;sc.correct++}
result=correct||q.type==="survey"?"בסדר":"ERROR";
}
}
}
saveLocal();return result;
}

function questionTabs(){return `<div class="question-tabs"><button class="${qFilter==="all"?"active":""}" data-action="q-filter" data-filter="all">כל השאלות</button><button class="${qFilter==="quiz"?"active":""}" data-action="q-filter" data-filter="quiz">שאלות ידע</button><button class="${qFilter==="survey"?"active":""}" data-action="q-filter" data-filter="survey">סקרים</button><span class="drag-note">${ic("grip",12)}גרירה לשינוי הסדר</span></div>`}

let qs=state.questions.filter(q=>qFilter==="all"||q.type===qFilter);if(compact)qs=qs.slice(0,4);

const requirements="Flask>=3.0,<4.0\nwaitress>=3.0,<4.0\n";
const readme=`קליק — Python + HTML
===================
1. Python 3.10 ומעלה.
2. שמרו index.html, app.py ו-requirements.txt באותה תיקייה.
3. התקנה: python -m pip install -r requirements.txt
4. הפעלה: python app.py
5. פתחו http://localhost:5000. מפתח הניהול מופיע במסוף ונשמר ב-data/.admin-token.

שיחות:
הגדירו מספר חיוג אצל ספק הטלפוניה. השרת אינו מספק מספר או שיחה בעצמו.
הפנו מהספק בקשות GET/POST לכתובת HTTPS ציבורית של השרת:
כניסה: /api/phone?key=PHONE_KEY&ApiPhone=0501234567
תשובה: /api/phone?key=PHONE_KEY&ApiPhone=0501234567&תשובה=3
ניתוק: /api/phone?key=PHONE_KEY&ApiPhone=0501234567&hangup=yes
PHONE_KEY נמצא בהגדרות המשחק לאחר כניסה כמנהל.
השרת מחזיר טקסט UTF-8: בסדר או ERROR. כשל אימות מפתח מחזיר גם HTTP 403.
בקשות תשובה שגויות תקינות נרשמות כניסיון היחיד. כפילויות נדחות.
בקשה ללא תשובה מחברת; hangup מסיר מהמחוברים בלי למחוק ניקוד.

ניקוד:
נקודות בסדר יורד. רק בשוויון, סכום זמני תשובות נכונות במילישניות בסדר עולה.
הזמן מחושב בשרת מקבלת הבקשה, מתחילת חלון המענה, ללא זמן השהיה.
הזמן כולל השהיות רשת וטלפוניה; לא ניתן למדוד מהשרת זמן הקשה נטו.
סקרים נשמרים ללא ניקוד. לכל שחקן ניסיון יחיד לכל שאלה.

שמירה:
data/click.db הוא מקור הנתונים; הוא שומר ניקוד וניסיונות באותה טרנזקציה.
data/players.csv ו-data/questions.json מתעדכנים אוטומטית.
לכל משחק תיקייה data/games/GAME_ID ובה scores.csv, answers.csv ו-game.json.
איפוס שומר תמונת מצב של המשחק הקודם ומתחיל ניקוד חדש, בלי לנתק משתתפים.
מחיקת היסטוריה מוחקת גם את תיקיות המשחקים שנבחרו, אך לא את המשחק הנוכחי.

סנכרון:
SSE: /api/events. אין צורך לרענן את מסך הקהל.
קישור למסך קהל: /?audience=1
במצב הדגמה בלבד, חלונות באותו מקור ודפדפן מסתנכרנים ב-BroadcastChannel וב-localStorage.
מחשבים וטלפונים שונים דורשים את שרת Python.

Excel:
ייבוא באמצעות SheetJS בדפדפן. התבניות זמינות בממשק.
שמרו מזהי טלפון כתאי טקסט כדי לא לאבד אפסים מובילים.
קובץ השאלות השמור הוא JSON; ניתן לייבא גם XLSX, XLS ו-CSV.
אין בממשק קוד תלוי ספק טלפוניה; התאימו את זרימת הכניסה, ההקשות והניתוק אצל הספק.

הפעלה ציבורית:
אל תחשפו את שרת הפיתוח ישירות לאינטרנט. השתמשו ב-HTTPS reverse proxy,
הגבילו גישה לנתוני data, הגדירו CLICK_ADMIN_TOKEN וסוד session קבוע.
COOKIE_SECURE=1 כאשר ניגשים ב-HTTPS בלבד.
אפשר להפעיל תהליך יחיד:
waitress-serve --listen=127.0.0.1:5000 --threads=32 app:app
אין להריץ כמה תהליכי worker: מנוע המשחק בזיכרון של תהליך יחיד.
חיבורי SSE צורכים threads; התאימו את המספר לכמות מסכי הניהול והקהל.
אין CORS פתוח. הניהול עובד מאותו origin וב-session HttpOnly.
ייבוא Excel, הורדת ZIP והגופן משתמשים בספריות CDN המופיעות ב-index.html.
גבו את תיקיית data לפני עדכונים. אין לסמוך על הדגמת localStorage לשימוש אמיתי.
`;
async function downloadKit(){
if(!window.JSZip){serverModal();toast("ספריית ZIP לא נטענה. ניתן להוריד את הקבצים בנפרד.");return}
const zip=new JSZip();zip.file("index.html",cleanHTML);zip.file("app.py",$("#pythonSource").textContent.trimStart());zip.file("requirements.txt",requirements);zip.file("README.txt",readme);
const blob=await zip.generateAsync({type:"blob"});download("click-studio.zip",blob,"application/zip");toast("ערכת השרת מוכנה להורדה");
}
function csvText(rows){return "\uFEFF"+rows.map(r=>r.map(v=>{let s=String(v??"");if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}).join(",")).join("\r\n")}

function parseCSV(text){
text=text.replace(/^\uFEFF/,"");const sep=(text.split("\n")[0].split(";").length>text.split("\n")[0].split(",").length)?";":",";
const rows=[];let row=[],cell="",quoted=false;
for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===sep&&!quoted){row.push(cell);cell=""}else if((c==="\n"||c==="\r")&&!quoted){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=""}else cell+=c}
row.push(cell);if(row.some(x=>x.trim()))rows.push(row);const headers=rows.shift()||[];return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h.trim(),r[i]??""])));
}

function updateTimer(){

async function detectServer(){

document.addEventListener("dragleave",e=>e.target.closest(".question-row")?.classList.remove("drag-over"));
document.addEventListener("dragend",()=>{draggedID=null;document.querySelectorAll(".dragging,.drag-over").forEach(e=>e.classList.remove("dragging","drag-over"))});
document.addEventListener("drop",async e=>{const row=e.target.closest(".question-row");if(!row||!draggedID)return;e.preventDefault();const ids=state.questions.map(q=>q.id),from=ids.indexOf(draggedID),to=ids.indexOf(row.dataset.qid);if(from===to)return;ids.splice(from,1);ids.splice(to,0,draggedID);try{await act("reorder",{ids});toast("סדר השאלות עודכן")}catch(x){toast(x.message)}draggedID=null});
document.addEventListener("keydown",async e=>{
if(e.key==="Escape"){if($("#modalRoot").children.length)closeModal();else if(isStage)exitStage();return}
if(e.key==="Tab"&&$("#modalRoot").children.length){const focusables=[...$("#modalRoot").querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea')].filter(el=>el.offsetParent!==null);const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}return}
if(!isStage||!canControl()||$("#modalRoot").children.length||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.repeat)return;
try{if(e.key==="ArrowLeft"){e.preventDefault();if(state.game.phase!=="finished")await act("step")}else if(e.key==="ArrowRight"){e.preventDefault();await act("back")}else if(e.code==="Space"&&state.game.phase==="answering"){e.preventDefault();await act("pause")}}catch(x){toast(x.message)}
});
document.addEventListener("click",async e=>{
if(e.target.dataset.backdrop==="1"){closeModal();return}
const b=e.target.closest("[data-action],[data-view]");if(!b||b.disabled)return;
if(b.dataset.view){view=b.dataset.view;$("#content").innerHTML="";render();return}
const a=b.dataset.action,id=b.dataset.id;
try{
switch(a){
case "audience":showStage();break;
case "exit-stage":exitStage();break;
case "start":await act("start");showStage();break;
case "next":await act("step");break;
case "open":await act("open");break;
case "pause":await act("pause");break;
case "reset":resetModal();break;
case "fullscreen":try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(x){toast("מסך מלא אינו זמין כאן. אפשר להשתמש במקש F11 בדפדפן.")}break;
case "sound":audioOn=!audioOn;if(audioOn)beep();renderStage();break;
case "simulate":simulate();break;
case "q-filter":qFilter=b.dataset.filter;render();break;
case "add-question":questionModal();break;
case "edit-question":questionModal(id);break;
case "delete-question":lobbyOnly();confirmModal("למחוק את השאלה?","השאלה תוסר מהמשחק הנוכחי. משחקים שמורים בהיסטוריה לא ישתנו.","מחיקת שאלה",async()=>{await act("delete_question",{id});toast("השאלה נמחקה")},"trash");break;
case "move-question":{const ids=state.questions.map(q=>q.id),i=ids.indexOf(id),j=i+Number(b.dataset.dir);if(j>=0&&j<ids.length){[ids[i],ids[j]]=[ids[j],ids[i]];await act("reorder",{ids})}break}
case "import-questions":chooseFile("questions");break;
case "import-players":chooseFile("players");break;
case "template-questions":template("questions");break;
case "template-players":template("players");break;
case "export-questions":download("click-questions.json",JSON.stringify({format:"click-questions-v1",title:state.settings.title,questions:state.questions},null,2),"application/json;charset=utf-8");break;
case "add-player":playerModal();break;
case "edit-player":playerModal(id);break;
case "disconnect":await act("disconnect",{id});toast("המשתתף הוסר מהמחוברים. הניקוד נשמר.");break;
case "test-call":testModal();break;
case "export-scores":exportScores();break;
case "export-answers":exportAnswers();break;
case "open-history":await openHistory(id);break;
case "export-history":exportScores(await historySnapshot(id));break;
case "export-active-scores":if(activeHistory)exportScores(activeHistory);break;
case "export-active-answers":if(activeHistory)exportAnswers(activeHistory);break;
case "delete-history":confirmModal("למחוק את המשחק השמור?","כל נתוני המשחק הזה יימחקו מההיסטוריה, כולל קובצי הניקוד והתשובות בשרת. המשחק הנוכחי לא ישתנה.","מחיקת המשחק",async()=>{await act("delete_history",{id});toast("המשחק הוסר מההיסטוריה")},"trash");break;
case "clear-history":confirmModal("לנקות את כל ההיסטוריה?","כל המשחקים הקודמים והקבצים הנפרדים שלהם יימחקו. הפעולה אינה ניתנת לביטול. המשחק הנוכחי לא יימחק.","מחיקת כל ההיסטוריה",async()=>{await act("clear_history");toast("ההיסטוריה נמחקה")},"trash");break;
case "generate-key":$("#phoneKey").value=uid("phone")+uid("");toast("נוצר מפתח חדש. יש לשמור הגדרות כדי להפעיל אותו.");break;
case "copy-url":await copy(phoneURL());break;
case "server":serverModal();break;
case "login":loginModal();break;
case "logout":await fetch("/api/logout",{method:"POST"});authenticated=false;eventStream?.close();await loadServerState(true);connectEvents();closeModal();toast("יצאתם מניהול השרת");break;
case "download-kit":await downloadKit();break;
case "download-python":download("app.py",$("#pythonSource").textContent.trimStart(),"text/x-python;charset=utf-8");break;
case "download-html":download("index.html",cleanHTML,"text/html;charset=utf-8");break;
case "download-requirements":download("requirements.txt",requirements);break;
case "close-modal":closeModal();break;
}
}catch(x){toast(x.message||"הפעולה לא הושלמה")}
});
document.querySelectorAll("[data-icon]").forEach(e=>e.innerHTML=ic(e.dataset.icon));
render();
if(new URLSearchParams(location.search).get("audience")==="1"||location.hash==="#audience")showStage();
detectServer();
</script>
</body>
</html>
